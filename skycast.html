        let focusItems = [];   // flat list of all navigable items in the dropdown
        let sugResults = [];

        function openSuggestions() { sugBox.classList.add('open'); }
        function closeSuggestions() { sugBox.classList.remove('open'); sugFocusIdx = -1; focusItems = []; }

        function buildFocusItems() {
            focusItems = Array.from(sugBox.querySelectorAll('.suggestion-item, .recent-item'));
        }

        function updateFocusHighlight() {
            focusItems.forEach((el, i) => el.classList.toggle('focused', i === sugFocusIdx));
            if (sugFocusIdx >= 0 && focusItems[sugFocusIdx]) {
                focusItems[sugFocusIdx].scrollIntoView({ block: 'nearest' });
            }
        }

        function renderSuggestions(results) {
            sugResults = results;
            sugFocusIdx = -1;
            const recents = getRecents();

            let html = '';

            // ── Recent section (only show when no API results yet / empty query)
            if (!results.length && recents.length) {
                html += `<div class="sug-section-header">
                    <span class="sug-section-label">Recent Searches</span>
                    <button class="sug-clear-btn" onmousedown="clearRecentsUI()">Clear all</button>
                </div>`;
                recents.forEach((r, i) => {
                    html += `<div class="recent-item" data-recent="${i}" onmousedown="pickRecent(${i})">
                        <span class="recent-icon">🕐</span>
                        <span class="recent-name">${r.name}${r.country ? ', ' + r.country : ''}</span>
                        <button class="recent-remove" onmousedown="removeRecentUI(event,${i})">✕</button>
                    </div>`;
                });
            }

            // ── API suggestions
            if (results.length) {
                if (recents.length) html += '<div class="sug-divider"></div>';
                if (recents.length) {
                    html += `<div class="sug-section-header">
                        <span class="sug-section-label">Suggestions</span>
                    </div>`;
                }
                results.forEach((r, i) => {
                    const state = r.state ? `${r.state}, ` : '';
                    html += `<div class="suggestion-item" data-sug="${i}" onmousedown="pickSuggestion(${i})">
                        <span class="sug-pin">📍</span>
                        <div class="sug-body">
                            <div class="sug-name">${r.name}</div>
                            <div class="sug-meta">${state}${r.country}</div>
                        </div>
                        <span class="sug-country">${r.country}</span>
                    </div>`;
                });
            }

            if (!html) { closeSuggestions(); return; }
            sugBox.innerHTML = html;
            buildFocusItems();
            openSuggestions();
        }

        function showRecentsOnly() {
            const recents = getRecents();
            if (!recents.length) { closeSuggestions(); return; }
            renderSuggestions([]);
        }

        function pickSuggestion(idx) {
            const r = sugResults[idx];
            if (!r) return;
            cityInput.value = r.name;
            saveRecent({ name: r.name, country: r.country, lat: r.lat, lon: r.lon });
            closeSuggestions();
            fetchWeather(r.lat, r.lon);
        }

        function pickRecent(idx) {
            const r = getRecents()[idx];
            if (!r) return;
            cityInput.value = r.name;
            closeSuggestions();
            fetchWeather(r.lat, r.lon);
        }

        function removeRecentUI(e, idx) {
            e.stopPropagation();
            removeRecent(idx);
            showRecentsOnly();
        }

        function clearRecentsUI() {
            clearAllRecents();
            closeSuggestions();
        }

        async function fetchSuggestions(query) {
            if (!query || query.length < 2) { showRecentsOnly(); return; }
            try {
                const res = await fetch(`${GEO}/direct?q=${encodeURIComponent(query)}&limit=5&appid=${API_KEY}`);
                const data = await res.json();
                if (Array.isArray(data)) renderSuggestions(data);
            } catch (_) { closeSuggestions(); }
        }

        cityInput.addEventListener('input', () => {
            clearTimeout(sugDebounce);
            const v = cityInput.value.trim();
            if (!v) { showRecentsOnly(); return; }
            sugBox.innerHTML = '<div class="sug-loading">Searching…</div>';
            openSuggestions();
            sugDebounce = setTimeout(() => fetchSuggestions(v), 280);
        });

        cityInput.addEventListener('keydown', e => {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                sugFocusIdx = Math.min(sugFocusIdx + 1, focusItems.length - 1);
                updateFocusHighlight(); return;
            }
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                sugFocusIdx = Math.max(sugFocusIdx - 1, -1);
                updateFocusHighlight(); return;
            }
            if (e.key === 'Enter') {
                const focused = focusItems[sugFocusIdx];
                if (focused) {
                    if (focused.dataset.sug !== undefined) pickSuggestion(+focused.dataset.sug);
                    else if (focused.dataset.recent !== undefined) pickRecent(+focused.dataset.recent);
                } else { doSearch(); }
                closeSuggestions(); return;
            }
            if (e.key === 'Escape') closeSuggestions();
        });

        cityInput.addEventListener('focus', () => {
            if (!cityInput.value.trim()) showRecentsOnly();
            else if (sugResults.length) openSuggestions();
        });

        cityInput.addEventListener('blur', () => setTimeout(closeSuggestions, 160));

        // ── Patch searchByName to also save recents after geo lookup
        searchByName = async function (name) {
            show('loader');
            try {
                const geo = await fetch(`${GEO}/direct?q=${encodeURIComponent(name)}&limit=1&appid=${API_KEY}`).then(r => r.json());
                if (!Array.isArray(geo)) { showErr(geo.message || 'API error. Check your API key.'); return; }
                if (!geo.length) { showErr(`No results for "${name}"`); return; }
                saveRecent({ name: geo[0].name, country: geo[0].country, lat: geo[0].lat, lon: geo[0].lon });
                await fetchWeather(geo[0].lat, geo[0].lon);
            } catch (e) { showErr('Connection error. Check your API key.'); }
        };
    </script>
</body>

</html>
